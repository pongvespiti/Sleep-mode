runtime:
  scripts:
    - type: before-request
      code: "if (!bru.getEnvVar(\"waitDone\")) {\r

        \    setTimeout(() => {\r

        \        bru.setEnvVar(\"waitDone\", true);\r

        \    }, 3000);\r

        } else {\r

        \    bru.deleteEnvVar(\"waitDone\");\r

        }"
    - type: after-response
      code: "const responseJson = res.getBody();\r

        \r

        // ตรวจสอบ code และ rsc\r

        test('Code and rsc are valid', function () {\r

        \    expect(responseJson.rsc).to.equal(2000);\r

        });\r

        \r

        // ตรวจสอบ homes array\r

        test('Homes array is valid', function () {\r

        \    expect(responseJson.homes).to.be.an('array');\r

        });\r

        \r

        // ตรวจสอบ home object\r

        const home = responseJson.homes[0];\r

        test('Home object is valid', function () {\r

        \    expect(home).to.have.property('id').that.is.a('string');\r

        \    expect(home).to.have.property('data').that.is.an('object');\r

        });\r

        \r

        // เก็บ home_id ลง environment\r

        bru.setEnvVar(\"home_id_A\", home.id);\r

        \r

        // ตรวจสอบ rooms array\r

        const rooms = home.data.rooms;\r

        test('Rooms array is valid', function () {\r

        \    expect(rooms).to.be.an('array').that.is.not.empty;\r

        });\r

        \r

        // ตรวจสอบแต่ละ room\r

        rooms.forEach((room, roomIndex) => {\r

        \    test(`Room ${roomIndex} is valid`, function () {\r

        \        expect(room).to.have.property('id').that.is.a('string');\r

        \        expect(room).to.have.property('edges').that.is.an('array');\r

        \    });\r

        \r

        \    // เก็บ room_id ตัวแรกลง environment (ถ้ามี)\r

        \    if (roomIndex === 0) {\r

        \        bru.setEnvVar(\"room_id\", room.id);\r

        \    }\r

        \r

        \    // ตรวจสอบแต่ละ edge ใน room\r

        \    room.edges.forEach((edge, edgeIndex) => {\r

        \        test(`Edge ${edgeIndex} in Room ${roomIndex} is valid`, function () {\r

        \            expect(edge).to.have.property('ref_id').that.is.a('string');\r

        \        });\r

        \r

        \        // เก็บ ref_id ของ edge แรกตัวแรก\r

        \        if (roomIndex === 0 && edgeIndex === 0) {\r

        \            bru.setEnvVar(\"ref_id\", edge.ref_id);\r

        \        }\r

        \    });\r

        });\r

        bru.setEnvVar(\r

        \    \"savedResponse\",\r

        \    JSON.stringify(res.getBody())\r

        );"

